<style>
/* Layout: one central column like a tablet at the exam centre; road-marking dashes as progress, signal yellow as the single accent */
:root{
  --bg:#eef0ed; --surface:#ffffff; --ink:#15191c; --muted:#5a636a; --line:#d4d8d3;
  --accent:#f2b705; --accent-ink:#1d1700; --asphalt:#2a3036; --asphalt-ink:#f3f4f1;
  --good:#1b7f45; --good-bg:#e3f3e9; --bad:#c2352b; --bad-bg:#fbe7e5; --trap:#8a4b00; --trap-bg:#fff1cc;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111417; --surface:#1a1e22; --ink:#eceee9; --muted:#9aa3aa; --line:#2b3136;
  --accent:#f5c518; --accent-ink:#1d1700; --asphalt:#0b0d0f; --asphalt-ink:#eceee9;
  --good:#47c37c; --good-bg:#16291e; --bad:#f06559; --bad-bg:#331a18; --trap:#f5c518; --trap-bg:#2c2510; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111417; --surface:#1a1e22; --ink:#eceee9; --muted:#9aa3aa; --line:#2b3136;
  --accent:#f5c518; --accent-ink:#1d1700; --asphalt:#0b0d0f; --asphalt-ink:#eceee9;
  --good:#47c37c; --good-bg:#16291e; --bad:#f06559; --bad-bg:#331a18; --trap:#f5c518; --trap-bg:#2c2510; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:34px;font-weight:800;text-transform:uppercase;line-height:1}
.brand h1 span{background:var(--accent);color:var(--accent-ink);padding:0 6px;margin-left:2px}
.brand small{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px;color:var(--muted)}
@media (hover:hover){.ghost:hover{color:var(--ink);border-color:var(--muted)}}

/* home */
.hero{background:var(--asphalt);color:var(--asphalt-ink);border-radius:14px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero h2{font-size:clamp(30px,6vw,46px);font-weight:800;text-transform:uppercase;line-height:.95}
.hero p{margin:0;max-width:56ch;opacity:.85}
.road{height:6px;background:repeating-linear-gradient(90deg,var(--accent) 0 38px,transparent 38px 52px);opacity:.9}
.kpis{display:flex;gap:22px;flex-wrap:wrap;font-family:var(--mono);font-size:13px}
.kpis b{display:block;font-family:var(--display);font-size:30px;font-weight:700;line-height:1;color:var(--accent)}
.modes{display:grid;grid-template-columns:1fr;gap:10px}
@media (max-width:560px){.modes{grid-template-columns:1fr}}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
@media (hover:hover){.mode:hover{border-color:var(--ink);transform:translateY(-1px)}}
.mode h3{font-size:24px;font-weight:700;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.mode p{margin:0;color:var(--muted);font-size:14px}
.mode .tag{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:4px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.mode.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mode.primary p{color:var(--accent-ink);opacity:.8}
.mode.primary .tag{background:var(--accent-ink);color:var(--accent)}
.mode:disabled{opacity:.45;cursor:not-allowed;transform:none}
.themes{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;display:flex;gap:8px;align-items:center}
.chip .pct{font-family:var(--mono);font-size:12px;color:var(--muted)}
@media (hover:hover){.chip:hover{border-color:var(--ink)}}
.chip.sel{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.bar{height:4px;width:46px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.keys{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface);color:var(--ink)}

/* quiz */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.qmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.pill.trap{background:var(--trap-bg);color:var(--trap);border-color:transparent;font-weight:700}
.counter{font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.counter small{font-size:18px;color:var(--muted)}
.lane{display:flex;gap:4px;height:8px}
.lane i{flex:1;border-radius:2px;background:var(--line)}
.lane i.done{background:var(--ink)}
.lane i.ok{background:var(--good)} .lane i.ko{background:var(--bad)} .lane i.cur{background:var(--accent)}
.timer{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);transform-origin:left;transition:transform .1s linear}
.timer.low i{background:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px}
.question{font-size:clamp(19px,3.2vw,23px);font-weight:700;line-height:1.35;margin:0}
.hint{font-size:13px;color:var(--muted);margin-top:-8px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;background:var(--bg);border:2px solid transparent;border-radius:10px;padding:12px 14px;min-height:56px;transition:border-color .12s,background .12s}
@media (hover:hover){.opt:hover:not(:disabled):not(.sel){border-color:var(--muted)}}
.opt .k{flex:none;width:34px;height:34px;border-radius:7px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;background:var(--surface);border:1px solid var(--line)}
.opt .t{min-width:0}
.opt.sel{border-color:var(--ink)}
.opt.sel .k{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.missed{border-color:var(--good);border-style:dashed}
.opt:disabled{cursor:default}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:12px 20px;font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:var(--ink);color:var(--surface)}
.btn.y{background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.fb{border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-bg)} .fb.ko{background:var(--bad-bg)}
.fb strong{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.fb.ok strong{color:var(--good)} .fb.ko strong{color:var(--bad)}
.fb p{margin:0}
.streak{font-family:var(--mono);font-size:13px;color:var(--muted)}
.streak b{color:var(--ink)}

/* results */
.score{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.score .big{font-family:var(--display);font-size:clamp(70px,16vw,110px);font-weight:800;line-height:.85;font-variant-numeric:tabular-nums}
.score .big small{font-size:.4em;color:var(--muted)}
.verdict{font-family:var(--display);font-size:30px;font-weight:800;text-transform:uppercase;padding:4px 12px;border-radius:8px}
.verdict.pass{background:var(--good);color:#fff} .verdict.fail{background:var(--bad);color:#fff}
.review{display:flex;flex-direction:column;gap:10px}
.rv{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.rv.ok{border-left-color:var(--good)}
.rv .rq{font-weight:700}
.rv .ra{font-size:14px}
.rv .ra b{color:var(--good)}
.rv .ry{font-size:14px;color:var(--bad)}
.rv .re{font-size:14px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20}
html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.opt:active:not(:disabled){transform:scale(.985)}
#fb{scroll-margin-bottom:120px}
@media (hover:none){.keys{display:none}}
@media all{
  body{padding-block:calc(12px + env(safe-area-inset-top,0px)) 130px}
  .wrap{gap:14px}
  .brand h1{font-size:28px}
  .hero{padding:16px;gap:12px;border-radius:12px}
  .hero h2{font-size:28px}
  .hero p{font-size:15px}
  .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .kpis b{font-size:26px}
  .mode{padding:14px}
  .mode h3{font-size:21px}
  .chip{padding:9px 12px}
  .qhead{gap:8px}
  .counter{font-size:24px}
  .card{padding:16px;gap:14px;border-radius:12px}
  .question{font-size:21px;line-height:1.35}
  .hint{font-size:14px}
  .opt{min-height:64px;padding:14px;gap:14px;font-size:17px;border-radius:12px}
  .opt .k{width:38px;height:38px;font-size:22px}
  .fb p{font-size:16px}
  .pill{font-size:13px;padding:4px 10px}
  .ghost{font-size:15px;padding:8px 12px}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;gap:8px;flex-wrap:wrap;
    background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.08);
    padding:10px max(16px,env(safe-area-inset-right,0px),calc((100% - 480px)/2)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px),calc((100% - 480px)/2))}
  .dock .btn{flex:1;padding:17px;font-size:23px;border-radius:12px}
  .dock .btn.sec{flex:0 0 auto;padding:16px 14px;font-size:18px}
  .dock .streak{flex-basis:100%;text-align:center;margin:0!important}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .score .big{font-size:84px}
  .verdict{font-size:24px}
  .results-actions .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}
.card.anim{animation:pop .18s ease-out}

 S:"Points & sanctions", P:"Permis & catégories", V:"Vitesses & distances", R:"Règles de circulation",

const RAW=[

["P",1,"Pour passer du permis A2 au permis A, je dois :",["Avoir 2 ans de permis A2","Suivre une formation de 7 heures","Repasser l'examen du code","Repasser l'épreuve plateau"],[0,1],"2 ans d'ancienneté en A2 + formation de 7 h en auto-école. Pas d'examen à repasser."],
["P",0,"Âge minimum pour passer le permis A2 :",["16 ans","17 ans","18 ans","20 ans"],[2],"18 ans pour l'A2. 16 ans pour l'A1, 24 ans pour un accès direct au A."],
["P",0,"Le permis A1 permet de conduire une moto :",["Jusqu'à 125 cm³","Jusqu'à 11 kW","Jusqu'à 35 kW","Dès 16 ans"],[0,1,3],"A1 = 125 cm³ max, 11 kW max, rapport 0,1 kW/kg, accessible dès 16 ans."],

["P",0,"En période probatoire sans conduite accompagnée et sans infraction, je gagne chaque année :",["1 point","2 points","3 points","4 points"],[1],"6 → 8 → 10 → 12 points en 3 ans sans infraction (3 points par an avec l'AAC, 2 ans pour atteindre 12)."],
["P",1,"En probatoire, je commets une infraction qui me retire 3 points. Je dois :",["Rien de particulier","Suivre obligatoirement un stage de sensibilisation dans les 4 mois","Repasser le code","Payer une amende majorée automatique"],[1],"Retrait de 3 points ou plus en probatoire = lettre 48N et stage obligatoire dans les 4 mois, sinon amende et suspension possibles."],

// ---------- POINTS & SANCTIONS ----------
["S",1,"Je suis flashé à 4 km/h au-dessus de la limite (après marge). Je perds :",["0 point","1 point","2 points","3 points"],[0],"Depuis le 1er janvier 2024, les excès de moins de 5 km/h ne retirent plus de point. L'amende reste due."],
["S",0,"Excès de vitesse de 25 km/h : retrait de points ?",["1 point","2 points","3 points","4 points"],[1],"De 20 à moins de 30 km/h : 2 points. De 30 à 40 : 3 points. De 40 à 50 : 4 points. 50 et plus : 6 points."],
["S",0,"Excès de vitesse de 45 km/h :",["3 points","4 points","Suspension de permis possible jusqu'à 3 ans","Confiscation automatique de la moto"],[1,2],"De 40 à moins de 50 km/h : 4 points et suspension possible jusqu'à 3 ans."],
["S",0,"Excès de vitesse de 50 km/h ou plus :",["4 points","6 points","Suspension possible","Rétention immédiate du permis possible"],[1,2,3],"6 points, rétention immédiate, suspension. En récidive c'est un délit."],
["S",0,"Je passe un feu rouge. Je perds :",["2 points","3 points","4 points","6 points"],[2],"Feu rouge ou stop non respecté : 4 points et 135 €."],
["S",0,"Téléphone tenu en main en roulant :",["135 €","3 points","1 point","Rétention du permis possible si autre infraction en même temps"],[0,1,3],"135 € et 3 points. Si en plus tu commets une autre infraction (vitesse, feu...), rétention et suspension possibles."],
["S",1,"Mon casque est sur la tête mais la jugulaire n'est pas attachée :",["C'est autorisé en ville","C'est considéré comme un casque non porté","Je risque 3 points","Je risque 1 point"],[1,2],"Casque non attaché = casque non porté : 135 € et 3 points."],
["S",0,"Je roule sans gants homologués :",["68 € d'amende","1 point retiré","3 points retirés","Aucune sanction, c'est conseillé"],[0,1],"Gants CE obligatoires depuis 2016 pour le conducteur et le passager : 68 € et 1 point pour le conducteur."],
["S",0,"Distance de sécurité insuffisante :",["1 point","2 points","3 points","Pas de retrait de points"],[2],"Non-respect des distances de sécurité : 3 points et 135 €."],

["S",1,"Un détecteur de radar dans mon blouson :",["Autorisé s'il est éteint","Interdit : 1 500 € et 6 points","Interdit : 135 € et 3 points","Autorisé s'il vient d'une application"],[1],"Le détecteur est interdit (6 points, 1 500 €, saisie). Les applis d'aide à la conduite qui signalent des zones de danger, elles, sont autorisées."],

const QS=RAW.map((r,i)=>({id:i,th:r[0],trap:!!r[1],q:r[2],o:r[3],a:r[4],e:r[5]}));

/* ============ STOCKAGE ============ */
const KEY="rafale-etm-v1";
let ST={q:{},best:0,exams:0,passed:0};
try{const s=localStorage.getItem(KEY); if(s) ST=Object.assign(ST,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
function rec(id,ok){const r=ST.q[id]||{c:0,w:0,last:null}; ok?r.c++:r.w++; r.last=ok?1:0; ST.q[id]=r; save();}
const errorsList=()=>QS.filter(q=>ST.q[q.id]&&ST.q[q.id].last===0);
const seenCount=()=>Object.keys(ST.q).length;

/* ============ OUTILS ============ */
const $=s=>document.querySelector(s);
const app=$("#app");
const L="ABCD";
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,1800)}
// mélange l'ordre des réponses à chaque tirage
function prep(q){const idx=shuffle(q.o.map((_,i)=>i));return {...q,o:idx.map(i=>q.o[i]),a:idx.map((i,k)=>q.a.includes(i)?k:-1).filter(k=>k>=0)}}
// tirage pondéré : erreurs et questions jamais vues sortent plus souvent
function weight(q){const r=ST.q[q.id];if(!r)return 3;return 1+r.w*3-(r.c*0.5)+(r.last===0?4:0)+(q.trap?1:0)}
function pickWeighted(pool,n,avoid){const out=[];let p=pool.filter(q=>!avoid||!avoid.has(q.id));if(p.length<n)p=pool.slice();
  p=p.map(q=>({q,w:Math.max(.4,weight(q))*Math.random()}));p.sort((a,b)=>b.w-a.w);return p.slice(0,n).map(x=>x.q)}

/* ============ ÉTAT ============ */
let S=null, timerInt=null;

/* ============ ACCUEIL ============ */
function home(){
  stopTimer(); S=null;
  const errs=errorsList().length, traps=QS.filter(q=>q.trap).length;
  const total=Object.values(ST.q).reduce((s,r)=>s+r.c+r.w,0), good=Object.values(ST.q).reduce((s,r)=>s+r.c,0);
  const chips=Object.keys(TH).map(k=>{
    const qs=QS.filter(q=>q.th===k);
    const c=qs.reduce((s,q)=>s+(ST.q[q.id]?.c||0),0), w=qs.reduce((s,q)=>s+(ST.q[q.id]?.w||0),0);
    const pct=c+w?Math.round(c/(c+w)*100):null;
    return `<button class="chip" data-th="${k}">${TH[k]} <span class="pct">${qs.length}q${pct!==null?" · "+pct+"%":""}</span><span class="bar"><i style="width:${pct||0}%"></i></span></button>`}).join("");
  app.innerHTML=`
  <div class="top"><div class="brand"><h1>Rafale<span>ETM</span></h1><small>code moto</small></div>
    <button class="ghost" id="reset">Remettre à zéro</button></div>
  <section class="hero">
    <div class="road"></div>
    <h2>${QS.length} questions qui font tomber les candidats</h2>
    <p>Chiffres à connaître par cœur, pièges de formulation, réponses multiples comme à l'examen. 40 questions, 35 bonnes réponses pour l'avoir.</p>
    <div class="kpis">
      <div><b>${seenCount()}/${QS.length}</b>vues</div>
      <div><b>${total?Math.round(good/total*100)+"%":"–"}</b>réussite</div>
      <div><b>${ST.best?ST.best+"/40":"–"}</b>meilleure série</div>
      <div><b>${ST.passed}/${ST.exams}</b>séries réussies</div>
    </div>
  </section>
  <div class="modes">
    <button class="mode primary" data-m="exam"><h3>Série examen <span class="tag">40Q · 30S</span></h3><p>Chrono de 30 s par question, aucune correction avant la fin. 5 fautes maximum.</p></button>
    <button class="mode" data-m="rafale"><h3>Rafale <span class="tag">∞</span></h3><p>Correction immédiate, passage automatique quand c'est juste. Les questions ratées reviennent plus souvent.</p></button>
    <button class="mode" data-m="trap"><h3>Pièges <span class="tag">${traps}</span></h3><p>Uniquement les questions à double lecture et les exceptions qui coûtent des points.</p></button>
    <button class="mode" data-m="errors" ${errs?"":"disabled"}><h3>Mes erreurs <span class="tag">${errs}</span></h3><p>${errs?"Les questions ratées à ta dernière tentative, jusqu'à ce qu'elles soient justes.":"Aucune erreur enregistrée pour l'instant."}</p></button>
  </div>
  <section class="themes"><span class="label">Révision par thème</span><div class="chips">${chips}</div></section>
  <div class="keys"><span><kbd>A</kbd>–<kbd>D</kbd> ou <kbd>1</kbd>–<kbd>4</kbd> cocher</span><span><kbd>Entrée</kbd> valider / suivant</span><span><kbd>Échap</kbd> accueil</span></div>`;
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>start(b.dataset.m));
  app.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>start("theme",b.dataset.th));
  $("#reset").onclick=()=>{const b=$("#reset");if(b.dataset.c){ST={q:{},best:0,exams:0,passed:0};save();home();toast("Statistiques effacées")}else{b.dataset.c=1;b.textContent="Confirmer ?";setTimeout(()=>{if(b.isConnected){delete b.dataset.c;b.textContent="Remettre à zéro"}},2500)}};
}

/* ============ DÉMARRAGE ============ */
function start(mode,th){
  let list;
  if(mode==="exam") list=pickWeighted(QS,40);
  else if(mode==="trap") list=shuffle(QS.filter(q=>q.trap));
  else if(mode==="errors") list=shuffle(errorsList());
  else if(mode==="theme") list=shuffle(QS.filter(q=>q.th===th));
  else list=[];
  S={mode,th,list:list.map(prep),i:0,sel:new Set(),answered:false,results:[],streak:0,bestStreak:0,recent:new Set()};
  if(mode==="rafale") S.list=[prep(pickWeighted(QS,1)[0])];
  render();
}
const isExam=()=>S.mode==="exam";
const total=()=>S.mode==="rafale"?null:S.list.length;

/* ============ QUESTION ============ */
function render(){
  const q=S.list[S.i];
  S.sel=new Set(); S.answered=false;
  const multi=q.a.length>1;
  const n=total();
  const lane=n?`<div class="lane">${S.list.map((_,k)=>{
      let c=""; if(k<S.i){c=isExam()?"done":(S.results[k]?.ok?"ok":"ko")} else if(k===S.i)c="cur"; return `<i class="${c}"></i>`}).join("")}</div>`:"";
  const title={exam:"Série examen",rafale:"Rafale",trap:"Pièges",errors:"Mes erreurs",theme:TH[S.th]}[S.mode];
  app.innerHTML=`
  <div class="qhead">
    <button class="ghost" id="quit">← ${title}</button>
    <div class="qmeta">
      ${!isExam()&&q.trap?'<span class="pill trap">PIÈGE</span>':""}
      <span class="pill">${TH[q.th]}</span>
      <span class="counter">${n?`${S.i+1}<small>/${n}</small>`:`${S.results.filter(r=>r.ok).length}<small>/${S.results.length}</small>`}</span>
    </div>
  </div>
  ${lane}
  ${isExam()?'<div class="timer" id="timer"><i></i></div>':""}
  <div class="card anim">
    <p class="question">${esc(q.q)}</p>
    <div class="hint">${isExam()?"Une ou plusieurs bonnes réponses":(multi?"Plusieurs bonnes réponses":"Une seule bonne réponse")}</div>
    <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}" id="opt${k}"><span class="k">${L[k]}</span><span class="t">${esc(o)}</span></button>`).join("")}</div>
    <div id="fb"></div>
    <div class="actions dock">
      ${S.mode==="rafale"?`<span class="streak" style="margin-right:auto;align-self:center">Série en cours <b>${S.streak}</b> · record <b>${S.bestStreak}</b></span>`:""}
      ${S.mode==="rafale"?'<button class="btn sec" id="stop">Terminer</button>':""}
      <button class="btn y" id="go" disabled>Valider</button>
    </div>
  </div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>toggle(+b.dataset.k));
  $("#go").onclick=action;
  $("#quit").onclick=()=>{ if(S.results.length && S.mode!=="exam") results(); else home(); };
  if($("#stop")) $("#stop").onclick=results;
  window.scrollTo(0,0);
  if(isExam()) startTimer();
}
function toggle(k){
  if(S.answered)return; const q=S.list[S.i]; if(k>=q.o.length)return;
  S.sel.has(k)?S.sel.delete(k):S.sel.add(k);
  document.querySelectorAll(".opt").forEach((b,i)=>b.classList.toggle("sel",S.sel.has(i)));
  $("#go").disabled=S.sel.size===0;
}
function action(){ if(S.answered) next(); else if(S.sel.size||isExam()) validate(); }
function validate(){
  stopTimer();
  const q=S.list[S.i];
  const ok=q.a.length===S.sel.size&&q.a.every(k=>S.sel.has(k));
  S.answered=true;
  S.results[S.i]={q,sel:[...S.sel],ok};
  rec(q.id,ok);
  if(isExam()){ next(); return; }
  S.streak=ok?S.streak+1:0; S.bestStreak=Math.max(S.bestStreak,S.streak);
  document.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;
    const good=q.a.includes(i), s=S.sel.has(i);
    if(good&&s)b.classList.add("right"); else if(s)b.classList.add("wrong"); else if(good)b.classList.add("missed","right");});
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"ko"}"><strong>${ok?"Juste":"Faux"}</strong>${ok?"":`<p>Bonne réponse : <b>${q.a.map(k=>L[k]).join(" + ")}</b></p>`}<p>${esc(q.e)}</p></div>`;
  const go=$("#go"); go.disabled=false; go.textContent="Suivante →"; go.focus({preventScroll:true});
  try{navigator.vibrate&&navigator.vibrate(ok?12:[30,40,30])}catch(e){}
  requestAnimationFrame(()=>{try{$("#fb").scrollIntoView({block:"nearest",behavior:"smooth"})}catch(e){}});
  if(S.mode==="rafale"){const st=document.querySelector(".streak");if(st)st.innerHTML=`Série en cours <b>${S.streak}</b> · record <b>${S.bestStreak}</b>`;
    const c=document.querySelector(".counter");if(c)c.innerHTML=`${S.results.filter(r=>r.ok).length}<small>/${S.results.length}</small>`;}
  if(ok){ const id=S.i; setTimeout(()=>{ if(S&&S.i===id&&S.answered) next(); }, q.e.length>140?2600:1700); }
}
function next(){
  if(S.mode==="rafale"){
    S.recent.add(S.list[S.i].id); if(S.recent.size>25){S.recent.delete(S.recent.values().next().value)}
    S.list.push(prep(pickWeighted(QS,1,S.recent)[0])); S.i++; render(); return;
  }
  if(S.i<S.list.length-1){S.i++;render()} else results();
}

/* ============ CHRONO ============ */
function startTimer(){
  stopTimer(); const dur=30000, t0=performance.now(); const el=$("#timer");
  timerInt=setInterval(()=>{const r=Math.max(0,1-(performance.now()-t0)/dur);
    if(el){el.firstChild.style.transform=`scaleX(${r})`;el.classList.toggle("low",r<.25)}
    if(r<=0){stopTimer();validate()}},100);
}
function stopTimer(){clearInterval(timerInt);timerInt=null}

/* ============ RÉSULTATS ============ */
function results(){
  stopTimer();
  const R=S.results.filter(Boolean), good=R.filter(r=>r.ok).length, n=R.length;
  const exam=isExam();
  if(exam){ST.exams++; if(good>=35)ST.passed++; ST.best=Math.max(ST.best,good); save();}
  const pass=exam?good>=35:(n?good/n>=.875:false);
  let filter="ko";
  const draw=()=>{
    const items=R.filter(r=>filter==="all"||!r.ok);
    $("#rv").innerHTML=items.length?items.map(r=>`<div class="rv ${r.ok?"ok":""}">
      <div class="rq">${r.q.trap?'<span class="pill trap">PIÈGE</span> ':""}${esc(r.q.q)}</div>
      <div class="ra">Bonne réponse : <b>${r.q.a.map(k=>esc(r.q.o[k])).join(" · ")}</b></div>
      ${r.ok?"":`<div class="ry">Ta réponse : ${r.sel.length?r.sel.map(k=>esc(r.q.o[k])).join(" · "):"aucune (temps écoulé)"}</div>`}
      <div class="re">${esc(r.q.e)}</div></div>`).join(""):`<p class="label">Aucune erreur, rien à revoir.</p>`;
    document.querySelectorAll("[data-f]").forEach(b=>b.classList.toggle("sel",b.dataset.f===filter));
  };
  app.innerHTML=`
  <div class="top"><button class="ghost" id="back">← Accueil</button><span class="label">${exam?"Série examen":"Bilan"}</span></div>
  <section class="card">
    <div class="score"><div class="big">${good}<small>/${n}</small></div>
      ${exam?`<span class="verdict ${pass?"pass":"fail"}">${pass?"Reçu":"Ajourné"}</span>`:""}</div>
    <p style="margin:0;color:var(--muted)">${exam?(pass?`Moins de 6 fautes : c'est le niveau de l'examen. ${40-good} faute${40-good>1?"s":""}.`:`${40-good} fautes, il en faut 5 maximum. Revois les explications ci-dessous puis lance « Mes erreurs ».`):`${n-good} erreur${n-good>1?"s":""} sur ${n} questions${S.bestStreak?` · meilleure série ${S.bestStreak}`:""}.`}</p>
    <div class="actions results-actions" style="justify-content:flex-start">
      <button class="btn y" id="again">${exam?"Nouvelle série":"Recommencer"}</button>
      ${errorsList().length?`<button class="btn sec" id="errs">Revoir mes erreurs (${errorsList().length})</button>`:""}
    </div>
  </section>
  <div class="filters"><button class="chip" data-f="ko">Erreurs (${n-good})</button><button class="chip" data-f="all">Toutes (${n})</button></div>
  <div class="review" id="rv"></div>`;
  $("#back").onclick=home;
  $("#again").onclick=()=>start(S.mode,S.th);
  if($("#errs"))$("#errs").onclick=()=>start("errors");
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;draw()});
  draw(); S.done=true; window.scrollTo(0,0);
}

/* ============ CLAVIER ============ */
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="Escape"){home();return}
  if(!S||S.done)return;
  const k=e.key.toUpperCase(); let i=L.indexOf(k); if(i<0&&/^[1-4]$/.test(e.key))i=+e.key-1;
  if(i>=0&&k.length===1){e.preventDefault();toggle(i);return}
  if(e.key==="Enter"||(e.key===" "&&S.answered)){e.preventDefault();action()}
});

home();
</script>

</body></html>
